[project]
name = "pimre"
version = "0.1.0"
description = "Photoemission Intensity MRF Reconstruction Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "natsort>=8.0",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "ipympl>=0.10.0",
    "pyqt5>=5.15.11",
]

[project.scripts]
pimre-dft = "pimre.cli:dft"
pimre-exp = "pimre.cli:exp"
pimre-mrf = "pimre.cli:mrf"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pimre"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
